profile_version: 2
name: codex-control-dsh-child-agent-team

codex_control_plane:
  coordinator:
    required: true
    mode: orchestrate_only
  advisor:
    required: false
    launch_when: requirement_or_acceptance_ambiguity
    mode: read_only_advice
  task_compiler_dispatcher:
    required: true
    mode: contracts_and_routing
  final_gate:
    required: true
    mode: evidence_only

dsh_agent_plane:
  code_explorer_debugger:
    transport_role: worker
    lifecycle: inherit_codex_child_agent
    default_write_mode: read_only
  coder:
    transport_role: worker
    lifecycle: inherit_codex_child_agent
    default_write_mode: contract_allowlist
  tester_test_engineer:
    backend: codex_child_agent
    # 模型不写死在交付物里：由 Team 配置在部署时提供该 Team 批准的具体模型 id。
    # `<team-configured-fallback-model>` 是占位符，不是可用的默认值。
    model: <team-configured-fallback-model>
    model_source: team_configuration
    reasoning: medium
    lifecycle: inherit_codex_child_agent
    default_write_mode: read_only_unless_test_wp_allows_writes
    production_code_writes: forbidden
    handles_long_wait_validation: true
  code_reviewer:
    transport_role: reviewer
    lifecycle: inherit_codex_child_agent
    orchestration_rule: reuse_compatible_idle_reviewer_unless_new_identity_is_required
    default_write_mode: read_only_disposable_workspace
  progress_recorder_reporter:
    transport_role: worker
    lifecycle: inherit_codex_child_agent
    default_write_mode: human_readable_reports_only

routing_invariants:
  dsh_transport_defines_role_lifecycle: false
  child_agent_lifecycle_authority: codex_orchestrator
  agent_to_dsh_session_binding: one_active_session_per_agent_identity
  follow_up_reuses_bound_session: true
  new_agent_reuses_old_agent_session: false
  all_project_code_creation_or_modification: dsh_only
  human_readable_progress_and_run_reports: dsh_reporter_preferred
  machine_evidence_generation: monitor_git_deterministic_tools
  codex_project_code_writes: forbidden
  reviewer_receives_worker_private_transcript: false
  fallback_to_codex_on_dsh_failure: true
  duplicate_dsh_codex_execution_for_reassurance: forbidden

model_lock:
  enabled: true
  role_replication_may_change_model: false
  quota_saving_may_change_model: false
  failure_recovery_may_change_model: false
  dsh_uses_configured_provider_and_model: true
  unavailable_model_requires_explicit_recovery: true

validation_policy:
  mode: minimum_sufficient
  repeat_unchanged_evidence: false
  full_repository_or_suite_by_default: false
  expand_only_for_changed_state_incomplete_evidence_distinct_surface_or_concrete_risk: true

integrity_policy:
  hash_checksum_digest_verification: forbidden
  hash_manifest_creation_or_update: forbidden
  hash_based_sync_or_validation: forbidden
  prefer_git_diff_direct_comparison_tests_and_runtime_evidence: true


dsh_failure_recovery:
  event_driven_first: true
  ordinary_initial_silence_seconds: 120
  ordinary_poll_interval_seconds_min: 120
  ordinary_poll_interval_seconds_max: 180
  allow_longer_wait_for_tests_builds_long_commands: true
  default_meaningful_recovery_attempts: 2
  repeated_equivalent_error_threshold: 3
  coordinator_may_replan_or_split_work_package: true
  replacement_dsh_child_allowed: true

fallback:
  enabled: true
  trigger: after_bounded_dsh_recovery_fails
  backend: codex_child_agent
  # 同上：公开交付物不携带任何固定模型 id；部署时由 Team 配置提供并保持模型锁。
  model: <team-configured-fallback-model>
  model_source: team_configuration
  reasoning: medium
  high_reasoning_forbidden: true
  preserve_original_role_contract: true
  coordinator_direct_task_takeover: false
  record_fallback_in_metrics_and_report: true

team_task_model:
  team_creation_authority: user_request_via_coordinator
  team_dissolve_authority: user_explicit_request_via_coordinator
  auto_dissolve_when_tasks_finish: false
  post_goal_state: awaiting_user_acceptance
  agent_pool_growth: on_demand
  allow_parallel_agent_creation: true
  same_role_growth_policy: capacity_aware_parallel_first
  same_role_growth_policy_notes:
    - exhaust_every_compatible_idle_agent_slot_before_creating_new_agent
    - spawn_additional_same_role_agent_when_independent_ready_tasks_remain_and_member_capacity_allows
    - wait_when_capacity_is_exhausted_instead_of_serializing_independent_tasks_behind_a_busy_agent
  max_members_source: coordinator_writes_required_team_parameter_at_team_creation_control_plane_projection
  max_members_hardcoded_default: none
  max_members_counts: all_non_terminated_team_members
  max_members_counted_states: all_states_except_terminated
  max_members_common_example_states: [running, idle]
  max_members_is_active_task_count: false
  spawn_only_after_all_compatible_idle_slots_are_full: true
  respect_user_role_caps: true
  prefer_idle_agent_reuse: true
  recruited_agents_are_long_lived: true
  task_completion_returns_agent_to_idle: true
  preserve_agent_session_while_idle: true
  auto_retire_on_task_completion: false
  auto_retire_when_temporarily_unassigned: false
  coordinator_retire_requires_no_future_reuse_assessment: true
  coordinator_retire_reason_required: true
  max_active_tasks_per_agent: 1
  task_dag: dynamic
  task_graph_write_authority: codex_coordinator_only
  task_graph_user_ui: read_only
  task_assignment: explicit_coordinator
  scheduler:
    mode: event_driven_simple
    order: capacity_aware_parallel_first
    phase_1: fill_every_compatible_idle_agent_with_one_active_task_and_reuse_its_session
    phase_2: spawn_additional_same_role_agents_in_parallel_for_remaining_independent_ready_tasks_while_member_capacity_allows
    phase_3: keep_independent_tasks_ready_or_waiting_when_capacity_is_exhausted_never_queue_them_behind_a_busy_agent
    safety_gates_required_together:
      - task_is_independently_acceptable
      - write_scopes_do_not_conflict_or_use_isolated_workspace
      - never_invent_pseudo_tasks_to_raise_parallelism
    auto_agent_claiming: false
    complex_optimization: false
    default_ready_order: stable_fifo_unless_explicit_priority

task_capability_routing:
  dsh_preferred:
    - code
    - short_or_medium_testing
    - powershell
    - cmd
    - git
    - file_operations
    - text_search
    - logs
    - process_status
    - port_pid_checks
    - short_scripts
  codex_side:
    visual_required: true
    long_wait_or_long_running: true
  visual_to_dsh_forbidden: true
  long_wait_to_dsh_forbidden: true


dsh_execution_permissions:
  required_mode: full_access
  apply_to_all_dsh_child_roles: true
  inherit_on_follow_up_resume: true
  inherit_on_replacement: true
  silent_downgrade_forbidden: true
  verify_effective_permission: true
  permission_failure_class: permission_propagation_failure
  full_access_does_not_override_role_contract: true
  full_access_does_not_override_write_allowlist: true
  full_access_does_not_authorize_irreversible_unscoped_actions: true


dsh_context_efficiency:
  apply_only_to_dsh_backed_roles: true
  exclude_codex_roles: true
  default_mode: bounded
  coordinator_curates_context_pack: true
  task_decomposition_should_minimize_context: true
  prefer_targeted_search_before_full_read: true
  prefer_symbol_or_range_reads_for_large_files: true
  avoid_project_wide_read_by_default: true
  avoid_re_reading_unchanged_large_files: true
  long_lived_agent_context_reuse: true
  refresh_changed_critical_files_only: true
  soft_primary_file_guideline_min: 1
  soft_primary_file_guideline_max: 5
  reconsider_task_or_context_before_full_reads_over: 8
  expansion_ladder:
    - compiled_context
    - primary_files
    - one_hop_dependencies
    - bounded_discovery
    - broad_investigation_with_justification

review_policy:
  reviewer_backend: dsh
  prefer_compatible_idle_reviewer_reuse: true
  fresh_reviewer_every_cycle: false
  parallel_same_role_reviewer_allowed: true
  parallel_reviewer_condition: multiple_independent_changes_pending_review_and_existing_reviewer_slots_occupied_and_role_cap_has_room
  reviewer_independence_via_context_and_workspace_isolation: true
  default_scope: change_scoped
  full_repo_review_by_default: false
  initial_context:
    - current_task_contract
    - candidate_diff
    - changed_files
    - direct_tests
  allowed_default_expansion:
    - one_hop_imports
    - one_hop_interfaces
    - one_hop_callers_callees
    - direct_configs
  broaden_only_with_evidence: true
  broader_review_triggers:
    - cross_module_refactor
    - shared_core_or_public_interface_change
    - security_or_data_integrity_risk
    - release_or_explicit_comprehensive_audit
    - cross_module_risk_found_during_scoped_review
